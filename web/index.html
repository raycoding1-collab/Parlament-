<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Országház — Hungarian Parliament Building (3D)</title>
<style>
  :root { --gold: #e6c27a; --ink: #f4efe6; --glass: rgba(14, 16, 22, 0.55); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07080c; overflow: hidden; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #title { position: fixed; left: max(22px, env(safe-area-inset-left)); top: max(18px, env(safe-area-inset-top)); pointer-events: none; text-shadow: 0 1px 12px rgba(0,0,0,.5); transition: opacity .6s; }
  #title h1 { font-family: "Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(26px, 3.4vw, 46px); letter-spacing: .02em; }
  #title p { font-size: clamp(10px, 1vw, 13px); letter-spacing: .32em; text-transform: uppercase; opacity: .78; margin-top: 4px; }
  #title p b { color: var(--gold); font-weight: 500; }
  #ui { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translate(-50%, 30px); opacity: 0; transition: all .8s cubic-bezier(.2,.8,.2,1);
        display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; max-width: calc(100vw - 24px); }
  #ui.show { opacity: 1; transform: translate(-50%, 0); }
  .group { display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255,255,255,.08); flex-wrap: wrap; justify-content: center; }
  button, select { font: inherit; font-size: 12.5px; letter-spacing: .03em; color: var(--ink); background: transparent; border: 0; padding: 8px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: background .25s, color .25s; }
  button:hover { background: rgba(255,255,255,.08); }
  button.on { background: linear-gradient(180deg, #f1d796, #c99a45); color: #1b1408; font-weight: 600; }
  select { background: rgba(255,255,255,.06); appearance: none; -webkit-appearance: none; padding-right: 14px; }
  select option { color: #111; }
  #hide { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); }
  body.clean #ui, body.clean #title, body.clean #hint { opacity: 0; pointer-events: none; }
  body.clean #hide { opacity: .35; }
  #credit { position: fixed; left: 12px; bottom: 8px; font-size: 10px; opacity: .5; letter-spacing: .02em; }
  #credit a { color: inherit; }
  body.clean #credit { opacity: .3; }
  #hint { position: fixed; right: 18px; bottom: 18px; font-size: 11px; opacity: .45; letter-spacing: .05em; pointer-events: none; }
  @media (max-width: 760px) { #hint { display: none; } button, select { font-size: 12px; padding: 7px 10px; } #ui { gap: 6px; } }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, #1a1712 0%, #07080c 70%); z-index: 10; transition: opacity .9s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { width: min(420px, 80vw); text-align: center; }
  #loading h2 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 34px; letter-spacing: .04em; }
  #loading .sub { font-size: 11px; letter-spacing: .35em; text-transform: uppercase; opacity: .6; margin: 6px 0 26px; }
  #loading .track { height: 2px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, #8b6a2e, var(--gold)); transition: width .4s; }
  #status { font-size: 12px; opacity: .7; margin-top: 14px; min-height: 1.4em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Országház</h1><p>Hungarian Parliament · Budapest · <b>1885–1904</b></p></div>
<button id="hide" title="Hide interface">◐</button>
<div id="ui">
  <div class="group">
    <button data-preset="morning">Morning</button>
    <button data-preset="day">Day</button>
    <button data-preset="golden">Golden hour</button>
    <button data-preset="blue">Blue hour</button>
    <button data-preset="night">Night</button>
  </div>
  <div class="group">
    <button data-view="danube">Danube</button>
    <button data-view="river">River level</button>
    <button data-view="castle">Castle</button>
    <button data-view="aerial">Aerial</button>
    <button data-view="dome">Dome</button>
    <button data-view="square">Kossuth tér</button>
    <button data-view="north">North</button>
  </div>
  <div class="group">
    <button id="orbit">Orbit</button>
    <button id="shot">4K still</button>
    <button id="glb">GLB</button>
    <select id="quality" title="Render quality"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
  </div>
</div>
<div id="hint">drag · orbit &nbsp; right-drag · pan &nbsp; scroll · zoom</div>
<div id="credit">Plan &amp; city: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL) · heights: Copernicus Urban Atlas</div>
<div id="loading"><div class="box"><h2>Országház</h2><div class="sub">Hungarian Parliament Building</div><div class="track"><div id="bar"></div></div><div id="status">Preparing…</div></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
